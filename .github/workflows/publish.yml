name: Publish Shiurim

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One production writer across manual, push, and scheduled runs.
concurrency:
  group: shiurim-production
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Moriahise/Shiurim'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Identify content review inputs
        id: review-key
        env:
          SHIURIM_REVIEW_MODEL: ${{ vars.SHIURIM_REVIEW_MODEL }}
        run: echo "key=$(python tools/content_review.py --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Reuse matching semantic preflight results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .review-cache
          key: shiurim-preflight-${{ steps.review-key.outputs.key }}
      - name: Run content preflight without granting approval
        env:
          SHIURIM_REVIEW_API_KEY: ${{ secrets.SHIURIM_REVIEW_API_KEY }}
          SHIURIM_REVIEW_MODEL: ${{ vars.SHIURIM_REVIEW_MODEL }}
        run: python tools/content_review.py --semantic auto
      - name: Refresh read-only source connections
        run: |
          python tools/source_hub.py sync
          python tools/source_hub.py health
      - name: Validate and release only approved editions
        run: |
          python tools/shiurim.py validate
          python tools/shiurim.py publish-due
          python tools/shiurim.py build
          node --check assets/site.js
          node --check assets/source-library.js
      - name: Persist publication ledger before deployment
        run: |
          test "$GITHUB_REPOSITORY" = 'Moriahise/Shiurim'
          if ! git diff --quiet -- content/publications.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- content/publications.json
            git commit -m 'Publish approved weekly edition'
            git push origin HEAD:main
          fi
      - name: Preserve complete build and run report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiurim-build-${{ github.run_id }}
          path: |
            dist/
            reports/latest-run.json
            reports/libraries-health.json
            reports/preflight/
          retention-days: 30
      - name: Detect Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'Moriahise/Shiurim':
              raise SystemExit('Wrong repository')
          request = urllib.request.Request('https://api.github.com/repos/' + repo + '/pages', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  settings = json.load(response)
              enabled = settings.get('build_type') == 'workflow'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          if not enabled:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Site built and checked\nGitHub Pages needs Settings → Pages → Source → **GitHub Actions**. Then run this workflow again. Sanhedrin is unaffected.\n')
          PY
      - name: Package Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Shiurim only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
