name: Publish Shiurim
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shiurim-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Moriahise/Shiurim'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the reader website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('site')
          assert (root/'index.html').is_file()
          fixed={'index.html','404.html','robots.txt','sitemap.xml','.nojekyll','about/index.html','sources/index.html'}
          fixed|={'assets/'+name for name in ['site.css','site.js','sources.css','source-library.js','sefaria-navigation.js','mark.svg']}
          fixed|={'data/'+name for name in ['calendar.json','catalogue.json','source-provenance.json','sefaria-library.json']}
          total=0
          for p in root.rglob('*'):
              assert not p.is_symlink(), 'Symbolic links are not reader assets'
              if not p.is_file(): continue
              name=p.relative_to(root).as_posix()
              assert name in fixed or re.fullmatch(r'shiur/[a-z0-9]+(?:-[a-z0-9]+)*/(?:sources/)?index.html',name), 'Unsupported reader path'
              total+=p.stat().st_size
          assert total<20_000_000
          catalogue=json.loads((root/'data/catalogue.json').read_text())
          for item in catalogue['editions']:
              assert set(item)=={'id','title','parashah','target_shabbat','category'}
          print('Reader website checked.')
          PY
      - name: Check stable portrait assignments and unchanged lesson text
        run: python3 -m unittest discover -s reader/tests -q
      - name: Add the Sanhedrin portrait collection to the deployment copy
        run: python3 reader/portraits.py --source site --output _site
      - name: Package website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}
