name: Validate Shiurim

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/shiurim.py validate
      - run: python tools/content_review.py --semantic off
      - run: python tools/shiurim.py build
      - run: node --check assets/site.js
      - run: node --check assets/source-library.js
      - run: node --test tests/test_sefaria_navigation.cjs tests/test_source_picker.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shiurim-preview
          path: dist/
          retention-days: 14
